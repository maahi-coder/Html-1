<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahenthiran Arumugam | AI Engineer & Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --accent-dark: #2563eb;
            --light: #f8fafc;
            --dark: #0f172a;
            --gray: #64748b;
            --gray-light: #cbd5e1;
            --success: #10b981;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-accent: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.7;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Particles Background */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Header & Navigation */
        header {
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .header-scrolled {
            padding: 10px 0;
            background-color: rgba(15, 23, 42, 0.98);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            transition: var(--transition);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
        }

        .logo i {
            margin-right: 10px;
            font-size: 1.5rem;
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
            padding: 5px 0;
        }

        .nav-links a:hover {
            color: var(--accent-light);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background: var(--gradient-accent);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a.active {
            color: var(--accent-light);
        }

        .nav-links a.active::after {
            width: 100%;
        }

        .mobile-menu {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: white;
            z-index: 1001;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, #1e293b 100%);
            color: white;
            padding: 200px 0 120px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" opacity="0.03"><polygon fill="white" points="0,1000 1000,0 1000,1000"/></svg>');
            background-size: cover;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-light);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(10px);
        }

        .hero-content h1 {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: fadeInUp 1s ease;
            font-weight: 800;
            line-height: 1.1;
        }

        .hero-content h2 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.8);
            animation: fadeInUp 1.2s ease;
        }

        .typing-text {
            display: inline-block;
            border-right: 2px solid var(--accent);
            padding-right: 5px;
            animation: blink 1s infinite;
        }

        .hero-content p {
            max-width: 700px;
            margin: 0 auto 40px;
            font-size: 1.2rem;
            animation: fadeInUp 1.4s ease;
            color: rgba(255, 255, 255, 0.9);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            background: var(--gradient-accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            margin: 8px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .btn i {
            margin-right: 8px;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }

        .btn-outline:hover {
            background: var(--accent);
            color: white;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            animation: fadeInUp 1.6s ease;
        }

        .contact-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            margin: 0 12px;
            color: white;
            font-size: 1.3rem;
            transition: var(--transition);
            text-decoration: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .contact-link:hover {
            background-color: var(--accent);
            transform: translateY(-5px) scale(1.1);
            box-shadow: var(--shadow);
        }

        /* Sections */
        section {
            padding: 120px 0;
            position: relative;
        }

        .section-title {
            text-align: center;
            margin-bottom: 70px;
            position: relative;
        }

        .section-title h2 {
            font-size: 2.8rem;
            color: var(--primary);
            display: inline-block;
            position: relative;
            font-weight: 800;
        }

        .section-title h2::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 5px;
            background: var(--gradient-accent);
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
        }

        .section-subtitle {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 50px;
            font-size: 1.2rem;
            color: var(--gray);
        }

        /* About Section */
        .about {
            background-color: white;
        }

        .about-content {
            display: flex;
            align-items: center;
            gap: 60px;
        }

        .about-text {
            flex: 1;
        }

        .about-text h3 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            color: var(--primary);
            font-weight: 700;
        }

        .about-text p {
            margin-bottom: 25px;
            color: var(--gray);
            font-size: 1.1rem;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .skill {
            background: var(--light);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--dark);
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border-left: 4px solid var(--accent);
        }

        .skill:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .about-image {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .profile-img-container {
            position: relative;
            display: inline-block;
        }

        .profile-img {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid white;
            box-shadow: var(--shadow-xl);
            position: relative;
            z-index: 2;
        }

        .profile-img-bg {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 390px;
            height: 390px;
            border-radius: 50%;
            background: var(--gradient-accent);
            z-index: 1;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.6; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Experience & Education */
        .experience {
            background-color: var(--light);
        }

        .timeline {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background: var(--gradient-accent);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
            border-radius: 5px;
        }

        .timeline-item {
            padding: 15px 40px;
            position: relative;
            width: 50%;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .timeline-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .timeline-item:nth-child(odd) {
            left: 0;
            animation-delay: 0.2s;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
            animation-delay: 0.4s;
        }

        .timeline-content {
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            position: relative;
            transition: var(--transition);
        }

        .timeline-content:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .timeline-content::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            right: -12px;
            background-color: white;
            top: 30px;
            border-radius: 50%;
            z-index: 1;
            border: 4px solid var(--accent);
            box-shadow: var(--shadow);
        }

        .timeline-item:nth-child(even) .timeline-content::after {
            left: -12px;
        }

        .timeline-date {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        .timeline-date i {
            margin-right: 8px;
        }

        .timeline-title {
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: var(--primary);
            font-weight: 700;
        }

        .timeline-company {
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .timeline-company i {
            margin-right: 8px;
            color: var(--accent);
        }

        /* Projects */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 35px;
        }

        .project-card {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-xl);
        }

        .project-image {
            height: 200px;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }

        .project-content {
            padding: 25px;
        }

        .project-title {
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: var(--primary);
            font-weight: 700;
        }

        .project-description {
            color: var(--gray);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tech-tag {
            background-color: var(--light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--dark);
            font-weight: 600;
        }

        .project-links {
            display: flex;
            gap: 15px;
        }

        .project-link {
            display: flex;
            align-items: center;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .project-link:hover {
            color: var(--accent-dark);
        }

        .project-link i {
            margin-right: 5px;
        }

        /* Achievements */
        .achievements {
            background-color: var(--light);
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .achievement-card {
            background-color: white;
            padding: 35px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .achievement-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--gradient-accent);
        }

        .achievement-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .achievement-icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .achievement-card h3 {
            margin-bottom: 12px;
            color: var(--primary);
            font-weight: 700;
        }

        /* Contact Section */
        .contact {
            background-color: white;
        }

        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .contact-item {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .contact-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .contact-icon {
            font-size: 2.2rem;
            color: var(--accent);
            margin-right: 20px;
            min-width: 60px;
            text-align: center;
        }

        .contact-details h3 {
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: 600;
        }

        .contact-form {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }

        /* Footer */
        footer {
            background: linear-gradient(135deg, var(--primary) 0%, #1e293b 100%);
            color: white;
            padding: 60px 0 30px;
